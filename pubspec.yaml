name: system_app_final
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  intl: ^0.20.2
  model_viewer_plus: ^1.7.0
  # --- NEW PACKAGES ---
  speech_to_text: ^7.3.0 # Or latest version
  permission_handler: ^12.0.1 # Or latest version
  table_calendar: ^3.1.2
  flutter_local_notifications: ^19.5.0
#  flutter_timezone: ^5.0.1
  timezone: ^0.10.1
  rename: ^3.1.0
  fl_chart: ^0.68.0
  provider: ^6.1.5+1

dependency_overrides:
  flutter_local_notifications_platform_interface: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

# This section is now at the correct indentation level (root)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  # This section is required to make the icon file available to the app
  assets:
    - assets/icon.png

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

